<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Unified robotics-circuit-physics doodle logo" fill="none">
  <defs>
    <linearGradient id="strokeGlow" x1="14" y1="18" x2="82" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35e9ff"/>
      <stop offset="0.48" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(48 48) rotate(90) scale(13)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff2b8"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0.38"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#67f0ff" flood-opacity="0.38"/>
    </filter>
  </defs>

  <g filter="url(#soft)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Single continuous emblem: arm joint + circuit loop + orbital arc in one stroke -->
    <path
      d="M22 58
         C22 42 34 28 49 28
         C64 28 75 39 75 52
         C75 64 66 72 54 72
         H39
         C31 72 25 66 25 58
         C25 52 30 47 36 47
         H58
         C63 47 67 43 67 38
         C67 32 62 27 56 27
         C50 27 45 32 45 38
         V53
         C45 58 41 62 36 62
         C31 62 27 58 27 53"
      stroke="url(#strokeGlow)"
      stroke-width="7"
    />

    <!-- Integrated nodes on the same emblem path -->
    <circle cx="22" cy="58" r="4.2" fill="#35e9ff" stroke="#092338" stroke-width="1.6"/>
    <circle cx="75" cy="52" r="4.2" fill="#ff7f7f" stroke="#3a1212" stroke-width="1.6"/>
    <circle cx="45" cy="38" r="4" fill="#ffd166" stroke="#3b2a06" stroke-width="1.6"/>
    <circle cx="48" cy="48" r="8.2" fill="url(#core)" stroke="#ffe08a" stroke-width="1.8"/>
  </g>
</svg>
